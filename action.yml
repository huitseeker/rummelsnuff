name: "Grumpy spam filter"
description: "Detect and label spam pull requests from forked repositories"
author: "Grumpy Maintainer"
inputs:
  access_token:
    description: "GitHub access token"
    required: true
  spam_label:
    description: "Spam label text"
    required: false
    default: "Spam"
  close_spam_prs:
    description: "Automatically close spam PRs (yes/no)?"
    required: false
    default: "yes"
runs:
  using: docker
  image: "Dockerfile"
  env:
    DOCKER_BUILDKIT: 1
branding:
  icon: "thumbs-down"
  color: "red"
