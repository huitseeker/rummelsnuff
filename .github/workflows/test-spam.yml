name: Test Grumpy Action (Self-Hosted)

on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch: # Allow manual testing

jobs:
  test-spam-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch history for better context
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Grumpy Test
        uses: ./
        if: github.event_name != 'workflow_dispatch'
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}
          spam_label: "Spam"
          close_spam_prs: "no" # Don't close test PRs automatically
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_INLINE_CACHE: 1

      - name: Manual Test Result
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          echo "Grumpy action test completed manually"