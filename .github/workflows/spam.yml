name: Grumpy spam filter
on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch: # Allow manual testing

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch history for better context
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run Grumpy (Published Version)
        uses: ./
        if: github.event_name != 'workflow_dispatch'
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}
          spam_label: "Spam"
          close_spam_prs: "yes"
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_INLINE_CACHE: 1

      - name: Build and run Grumpy (Local Build)
        if: github.event_name == 'workflow_dispatch'
        uses: ./
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}
          spam_label: "Spam"
          close_spam_prs: "no"
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_INLINE_CACHE: 1
