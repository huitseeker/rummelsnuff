name: Grumpy spam filter
on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch: # Allow manual testing

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Grumpy (Published Version)
        uses: grumpybot/grumpy@latest
        if: github.event_name != 'workflow_dispatch'
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}
          spam_label: "Spam"
          close_spam_prs: "yes"

      - name: Manual Test (Local Build)
        if: github.event_name == 'workflow_dispatch'
        uses: ./
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}
          spam_label: "Spam"
          close_spam_prs: "no"
